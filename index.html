<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D FBX Viewer & Gyroscope Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-100">

    <div id="canvas-container" class="relative w-full h-full">
        <!-- 3D Canvas will be injected here -->
    </div>

    <!-- Header / Top Bar Controls -->
    <header class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
        <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center gap-3 shadow-lg pointer-events-auto">
            <i class="fa-solid fa-cube text-indigo-400 text-xl"></i>
            <div>
                <h1 class="text-sm font-bold leading-tight">FBX & Gyro Viewer</h1>
                <p id="status-text" class="text-[11px] text-slate-400">Default scene active</p>
            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <!-- Reset View Button -->
            <button id="btn-reset" title="Reset View" class="glass-panel p-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200">
                <i class="fa-solid fa-arrows-to-dot text-base"></i>
            </button>
            <!-- Settings Toggle -->
            <button id="btn-settings-toggle" title="Settings" class="glass-panel p-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200">
                <i class="fa-solid fa-sliders text-base"></i>
            </button>
            <!-- Fullscreen Toggle -->
            <button id="btn-fullscreen" title="Fullscreen" class="glass-panel p-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200">
                <i class="fa-solid fa-expand text-base"></i>
            </button>
        </div>
    </header>

    <div id="settings-panel" class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-lg glass-panel rounded-3xl p-5 shadow-2xl z-20 transition-all duration-300 transform translate-y-0 opacity-100">
        
        <!-- Navigation Tabs / Quick Mode Selector -->
        <div class="flex bg-slate-900/60 p-1 rounded-2xl mb-4 border border-slate-700/50">
            <button id="mode-touch-btn" class="flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow">
                <i class="fa-solid fa-hand-pointer"></i> Orbit / Touch
            </button>
            <button id="mode-gyro-btn" class="flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-mobile-screen-button"></i> Smartphone Gyro
            </button>
        </div>

        <!-- File Upload Section -->
        <div class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <!-- FBX File Button -->
                <label class="flex flex-col items-center justify-center p-3 rounded-xl border border-dashed border-slate-600 hover:border-indigo-400 bg-slate-800/40 hover:bg-slate-800/70 transition cursor-pointer text-center group">
                    <i class="fa-solid fa-file-import text-indigo-400 group-hover:scale-110 transition mb-1 text-base"></i>
                    <span class="text-xs font-medium text-slate-200">Load FBX Model</span>
                    <span id="fbx-filename" class="text-[10px] text-slate-400 truncate w-full mt-0.5">No file chosen</span>
                    <input type="file" id="input-fbx" accept=".fbx" class="hidden">
                </label>

                <!-- Texture Files Button -->
                <label class="flex flex-col items-center justify-center p-3 rounded-xl border border-dashed border-slate-600 hover:border-emerald-400 bg-slate-800/40 hover:bg-slate-800/70 transition cursor-pointer text-center group">
                    <i class="fa-solid fa-image text-emerald-400 group-hover:scale-110 transition mb-1 text-base"></i>
                    <span class="text-xs font-medium text-slate-200">Load Textures</span>
                    <span id="texture-filename" class="text-[10px] text-slate-400 truncate w-full mt-0.5">Multiple allowed</span>
                    <input type="file" id="input-textures" accept="image/*" multiple class="hidden">
                </label>
            </div>

            <!-- Gyro Permission Request Alert Box (iOS Specific) -->
            <div id="gyro-permission-box" class="hidden bg-amber-500/15 border border-amber-500/30 rounded-xl p-3 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 text-amber-300 text-xs">
                    <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                    <span>Permission needed for motion sensors.</span>
                </div>
                <button id="btn-request-gyro" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition shadow">
                    Enable
                </button>
            </div>

            <!-- Expandable Settings Accordion -->
            <div class="pt-2 border-t border-slate-700/50 space-y-2">
                <!-- Lighting Brightness -->
                <div class="flex items-center justify-between gap-4">
                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-sun text-slate-400"></i> Light Intensity
                    </span>
                    <input type="range" id="slider-light" min="0.2" max="3.0" step="0.1" value="1.2" class="w-28 accent-indigo-500">
                </div>

                <!-- Camera FOV -->
                <div class="flex items-center justify-between gap-4">
                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-camera text-slate-400"></i> FOV
                    </span>
                    <input type="range" id="slider-fov" min="30" max="110" step="1" value="65" class="w-28 accent-indigo-500">
                </div>

                <!-- Options Bar -->
                <div class="flex justify-between items-center pt-1 text-xs text-slate-300">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk-autorotate" class="rounded accent-indigo-500">
                        <span>Auto Rotate</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk-wireframe" class="rounded accent-indigo-500">
                        <span>Wireframe</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 glass-panel border border-indigo-500/30 text-indigo-200 text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-30 flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i>
        <span id="toast-message">Message</span>
    </div>

    <script>
        let scene, camera, renderer, orbitControls;
        let currentFBX = null;
        const loadedTextures = new Map();
        
        // Gyroscope tracking state
        let gyroMode = false;
        let gyroPermissionGranted = false;
        let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
        let initialOrientation = null;
        
        // Smooth camera rotation target
        const targetQuaternion = new THREE.Quaternion();
        const currentQuaternion = new THREE.Quaternion();

        // Scene lights reference
        let ambientLight, dirLight;

        function initScene() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            // Camera setup
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // OrbitControls
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.maxDistance = 100;
            orbitControls.minDistance = 0.5;

            // Lighting setup
            ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 12, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.4);
            fillLight.position.set(-5, -2, -5);
            scene.add(fillLight);

            // Grid helper
            const gridHelper = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            // Default fallback object
            createDefaultModel();

            // Resize handling
            window.addEventListener('resize', onWindowResize);
        }

        function createDefaultModel() {
            if (currentFBX) scene.remove(currentFBX);

            const group = new THREE.Group();

            // Create stylized knot
            const geometry = new THREE.TorusKnotGeometry(1, 0.35, 128, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0x6366f1,
                roughness: 0.3,
                metalness: 0.8,
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.position.y = 1.5;
            group.add(mesh);

            // Pedestal
            const baseGeo = new THREE.CylinderGeometry(1.8, 2, 0.4, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = 0.2;
            baseMesh.receiveShadow = true;
            group.add(baseMesh);

            currentFBX = group;
            scene.add(currentFBX);

            orbitControls.target.set(0, 1.2, 0);
            camera.position.set(0, 2.5, 5);
            orbitControls.update();
        }

        document.getElementById('input-fbx').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fbx-filename').innerText = file.name;
            showToast('Loading FBX model...');

            const reader = new FileReader();
            reader.onload = function(event) {
                const contents = event.target.result;
                const loader = new THREE.FBXLoader();
                
                try {
                    const object = loader.parse(contents, '');
                    
                    if (currentFBX) scene.remove(currentFBX);
                    currentFBX = object;

                    // Compute bounding box to frame model correctly
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    // Normalize position to origin
                    object.position.x += (object.position.x - center.x);
                    object.position.y += (object.position.y - center.y) + (size.y / 2);
                    object.position.z += (object.position.z - center.z);

                    // Enable shadows & apply textures if already uploaded
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            applyStoredTexturesToMaterial(child);
                        }
                    });

                    scene.add(object);

                    // Adjust camera distance based on object size
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.2;
                    cameraZ = Math.max(cameraZ, 2);

                    camera.position.set(0, size.y / 2 + 1, cameraZ);
                    orbitControls.target.set(0, size.y / 2, 0);
                    orbitControls.update();

                    document.getElementById('status-text').innerText = `Loaded: ${file.name}`;
                    showToast('FBX Model loaded successfully!');
                } catch (error) {
                    console.error("Error parsing FBX:", error);
                    showToast('Failed to parse FBX file');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Texture Batch Upload Handler
        document.getElementById('input-textures').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            document.getElementById('texture-filename').innerText = `${files.length} texture(s) selected`;
            let loadedCount = 0;

            Array.from(files).forEach(file => {
                const url = URL.createObjectURL(file);
                const textureLoader = new THREE.TextureLoader();
                
                textureLoader.load(url, (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    texture.wrapT = THREE.RepeatWrapping;
                    
                    // Store texture with clean name key
                    const cleanName = file.name.toLowerCase();
                    loadedTextures.set(cleanName, texture);
                    loadedCount++;

                    // Re-apply to existing meshes
                    if (currentFBX) {
                        currentFBX.traverse((child) => {
                            if (child.isMesh) {
                                applyStoredTexturesToMaterial(child);
                            }
                        });
                    }

                    if (loadedCount === files.length) {
                        showToast(`Applied ${loadedCount} texture(s)`);
                    }
                });
            });
        });

        function applyStoredTexturesToMaterial(mesh) {
            if (!mesh.material) return;

            const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];

            materials.forEach((mat) => {
                loadedTextures.forEach((texture, name) => {
                    // Simple heuristic matching based on texture filenames
                    if (name.includes('diffuse') || name.includes('albedo') || name.includes('color') || name.includes('base')) {
                        mat.map = texture;
                    } else if (name.includes('normal') || name.includes('nor')) {
                        mat.normalMap = texture;
                    } else if (name.includes('roughness') || name.includes('rough')) {
                        mat.roughnessMap = texture;
                    } else if (name.includes('metallic') || name.includes('metal')) {
                        mat.metalnessMap = texture;
                    } else {
                        // Fallback: apply as main diffuse map if no other map exists
                        if (!mat.map) mat.map = texture;
                    }
                });
                mat.needsUpdate = true;
            });
        }

        function setupGyroscope() {
            // Check if iOS DeviceOrientation permissions are required
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('gyro-permission-box').classList.remove('hidden');
            }

            window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        }

        document.getElementById('btn-request-gyro').addEventListener('click', function() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            gyroPermissionGranted = true;
                            document.getElementById('gyro-permission-box').classList.add('hidden');
                            setGyroMode(true);
                            showToast('Gyroscope enabled');
                        } else {
                            showToast('Gyroscope permission denied');
                        }
                    })
                    .catch(console.error);
            }
        });

        function handleDeviceOrientation(event) {
            if (!event.alpha && !event.beta && !event.gamma) return;

            deviceOrientation.alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0; // Z
            deviceOrientation.beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;   // X'
            deviceOrientation.gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0; // Y''

            if (gyroMode) {
                updateCameraFromGyro();
            }
        }

        function updateCameraFromGyro() {
            const alpha = deviceOrientation.alpha; 
            const beta = deviceOrientation.beta;   
            const gamma = deviceOrientation.gamma; 

            const euler = new THREE.Euler();
            // Standard Euler rotation order for device orientation
            euler.set(beta, alpha, -gamma, 'YXZ');
            
            targetQuaternion.setFromEuler(euler);

            // Adjust orientation for screen landscape/portrait mode
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;
            const qScreen = new THREE.Quaternion();
            qScreen.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);
            targetQuaternion.multiply(qScreen);

            // Camera orientation offset to look forward in 3D
            const qWorld = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
            targetQuaternion.multiply(qWorld);
        }

        function setGyroMode(enable) {
            gyroMode = enable;
            const touchBtn = document.getElementById('mode-touch-btn');
            const gyroBtn = document.getElementById('mode-gyro-btn');

            if (gyroMode) {
                gyroBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow";
                touchBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
                
                orbitControls.enabled = false;
                document.getElementById('status-text').innerText = "Mode: Smartphone Gyro Look";
                showToast("Gyro Mode Active");
            } else {
                touchBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow";
                gyroBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
                
                orbitControls.enabled = true;
                document.getElementById('status-text').innerText = "Mode: Touch / Orbit Controls";
                showToast("Orbit Mode Active");
            }
        }

        document.getElementById('mode-touch-btn').addEventListener('click', () => setGyroMode(false));
        document.getElementById('mode-gyro-btn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function' && !gyroPermissionGranted) {
                document.getElementById('gyro-permission-box').classList.remove('hidden');
            }
            setGyroMode(true);
        });

        // Quick Settings Handlers
        document.getElementById('slider-light').addEventListener('input', (e) => {
            ambientLight.intensity = parseFloat(e.target.value) * 0.6;
            dirLight.intensity = parseFloat(e.target.value);
        });

        document.getElementById('slider-fov').addEventListener('input', (e) => {
            camera.fov = parseFloat(e.target.value);
            camera.updateProjectionMatrix();
        });

        document.getElementById('chk-autorotate').addEventListener('change', (e) => {
            orbitControls.autoRotate = e.target.checked;
            orbitControls.autoRotateSpeed = 2.0;
        });

        document.getElementById('chk-wireframe').addEventListener('change', (e) => {
            if (!currentFBX) return;
            currentFBX.traverse((child) => {
                if (child.isMesh && child.material) {
                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                    mats.forEach(m => m.wireframe = e.target.checked);
                }
            });
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            camera.position.set(0, 2.5, 5);
            orbitControls.target.set(0, 1, 0);
            orbitControls.update();
            showToast("View Reset");
        });

        // Toggle UI panel visibility
        const panel = document.getElementById('settings-panel');
        document.getElementById('btn-settings-toggle').addEventListener('click', () => {
            panel.classList.toggle('translate-y-0');
            panel.classList.toggle('translate-y-[120%]');
            panel.classList.toggle('opacity-0');
        });

        // Fullscreen Toggle
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast(`Fullscreen error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gyroMode) {
                // Smooth interpolation (slerp) to prevent gyro sensor jitter
                camera.quaternion.slerp(targetQuaternion, 0.1);
            } else {
                orbitControls.update();
            }

            renderer.render(scene, camera);
        }

        // Initialize Application on Window Load
        window.onload = function() {
            initScene();
            setupGyroscope();
            animate();
        };
    </script>
</body>
</html>
