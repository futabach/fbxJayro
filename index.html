<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D FBX Viewer & Gyroscope Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* 🧭 コンパスバーのスタイル設定 */
        .compass-wrapper {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 44px;
            overflow: hidden;
            border-radius: 9999px;
            pointer-events: none;
            z-index: 15;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .compass-track {
            position: absolute;
            top: 0;
            left: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            will-change: transform;
            transform: translateX(-50%);
        }
        .compass-mark {
            flex-shrink: 0;
            width: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .compass-tick {
            width: 1px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.3);
        }
        .compass-tick.major {
            height: 14px;
            width: 1.5px;
            background-color: rgba(255, 255, 255, 0.7);
        }
        .compass-label {
            font-size: 11px;
            font-weight: 700;
            margin-top: 2px;
            color: rgba(226, 232, 240, 0.7);
            transition: all 0.15s ease;
        }
        .compass-label.north {
            color: #f87171; /* Nは赤色で強調 */
        }
        .compass-indicator {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            color: #6366f1;
            font-size: 10px;
            z-index: 2;
            filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.8));
        }

        /* カスタムカラーピッカーのスタイル調整 */
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-slate-100">

    <div id="canvas-container" class="relative w-full h-full">
        <!-- 3D Canvas will be injected here -->
    </div>

    <!-- 🧭 水平コンパスバー UI -->
    <div class="compass-wrapper glass-panel">
        <div class="compass-indicator">
            <i class="fa-solid fa-caret-down"></i>
        </div>
        <div id="compass-track" class="compass-track">
            <!-- JavaScriptで目盛り・方位文字が挿入されます -->
        </div>
    </div>

    <!-- Header / Top Bar Controls -->
    <header class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
        <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center gap-3 shadow-lg pointer-events-auto">
            <i class="fa-solid fa-cube text-indigo-400 text-xl"></i>
            <div>
                <h1 class="text-sm font-bold leading-tight">FBX & Gyro Viewer</h1>
                <p id="status-text" class="text-[11px] text-slate-400">Default scene active</p>
            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <!-- Reset View Button -->
            <button id="btn-reset" title="Reset View" class="glass-panel p-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200">
                <i class="fa-solid fa-arrows-to-dot text-base"></i>
            </button>
            <!-- Settings Toggle -->
            <button id="btn-settings-toggle" title="Settings" class="glass-panel p-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200">
                <i class="fa-solid fa-sliders text-base"></i>
            </button>
            <!-- Fullscreen Toggle -->
            <button id="btn-fullscreen" title="Fullscreen" class="glass-panel p-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200">
                <i class="fa-solid fa-expand text-base"></i>
            </button>
        </div>
    </header>

    <!-- スマホ用 移動UIボタン -->
    <div id="mobile-controls" class="absolute bottom-28 left-1/2 -translate-x-1/2 flex gap-4 z-20 pointer-events-auto">
        <button id="btn-move-forward" class="glass-panel px-6 py-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200 font-bold flex items-center gap-2 shadow-lg">
            <i class="fa-solid fa-arrow-up"></i> 進む
        </button>
        <button id="btn-move-backward" class="glass-panel px-6 py-3 rounded-full hover:bg-slate-800/80 active:scale-95 transition text-slate-200 font-bold flex items-center gap-2 shadow-lg">
            <i class="fa-solid fa-arrow-down"></i> 戻る
        </button>
    </div>

    <div id="settings-panel" class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-lg glass-panel rounded-3xl p-5 shadow-2xl z-20 transition-all duration-300 transform translate-y-0 opacity-100 max-h-[85vh] overflow-y-auto">
        
        <!-- Navigation Tabs / Quick Mode Selector -->
        <div class="flex bg-slate-900/60 p-1 rounded-2xl mb-4 border border-slate-700/50">
            <button id="mode-touch-btn" class="flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow">
                <i class="fa-solid fa-hand-pointer"></i> Orbit / Touch
            </button>
            <button id="mode-gyro-btn" class="flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-mobile-screen-button"></i> Smartphone Gyro
            </button>
        </div>

        <!-- File Upload Section -->
        <div class="space-y-3">
            <div>
                <!-- FBX File Button (Full Width) -->
                <label class="flex flex-col items-center justify-center p-3 rounded-xl border border-dashed border-slate-600 hover:border-indigo-400 bg-slate-800/40 hover:bg-slate-800/70 transition cursor-pointer text-center group w-full">
                    <i class="fa-solid fa-file-import text-indigo-400 group-hover:scale-110 transition mb-1 text-base"></i>
                    <span class="text-xs font-medium text-slate-200">Load FBX Model</span>
                    <span id="fbx-filename" class="text-[10px] text-slate-400 truncate w-full mt-0.5">No file chosen</span>
                    <input type="file" id="input-fbx" accept=".fbx" class="hidden">
                </label>
            </div>

            <!-- 背景画像・背景色設定セクション -->
            <div class="p-3 bg-slate-900/60 rounded-2xl border border-slate-700/50 space-y-2.5">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-mountain-sun text-cyan-400"></i> Scene Background
                    </span>
                    <!-- 背景リセットボタン -->
                    <button id="btn-reset-bg" class="text-[11px] text-slate-400 hover:text-slate-200 underline transition">
                        Reset Default
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <!-- 背景画像アップロードボタン -->
                    <label class="flex items-center justify-center gap-2 p-2 rounded-xl border border-dashed border-slate-600 hover:border-cyan-400 bg-slate-800/40 hover:bg-slate-800/70 transition cursor-pointer text-center">
                        <i class="fa-solid fa-file-image text-cyan-400 text-sm"></i>
                        <span class="text-xs font-medium text-slate-200 truncate" id="bg-filename">Upload Image</span>
                        <input type="file" id="input-bg-image" accept="image/*" class="hidden">
                    </label>

                    <!-- 背景色選択カラーピッカー -->
                    <div class="flex items-center justify-between p-1.5 px-3 rounded-xl border border-slate-700 bg-slate-800/40">
                        <span class="text-xs text-slate-300">Solid Color</span>
                        <input type="color" id="picker-bg-color" value="#0f172a" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent">
                    </div>
                </div>

                <!-- 360度パノラマ Skybox モード切替 -->
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-slate-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-vr-cardboard text-purple-400"></i> 360° Panorama (Skybox)
                    </span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="chk-360-bg" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>
            </div>

            <!-- Gyro Permission Request Alert Box (iOS Specific) -->
            <div id="gyro-permission-box" class="hidden bg-amber-500/15 border border-amber-500/30 rounded-xl p-3 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 text-amber-300 text-xs">
                    <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                    <span>Permission needed for motion sensors.</span>
                </div>
                <button id="btn-request-gyro" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition shadow">
                    Enable
                </button>
            </div>

            <!-- Expandable Settings Accordion -->
            <div class="pt-2 border-t border-slate-700/50 space-y-2">
                <!-- 移動スピードスライダー -->
                <div class="flex items-center justify-between gap-4">
                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-gauge-high text-slate-400"></i> Move Speed
                    </span>
                    <input type="range" id="slider-movespeed" min="0.01" max="0.5" step="0.01" value="0.1" class="w-28 accent-indigo-500">
                </div>
                <!-- Lighting Brightness -->
                <div class="flex items-center justify-between gap-4">
                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-sun text-slate-400"></i> Light Intensity
                    </span>
                    <input type="range" id="slider-light" min="0.2" max="3.0" step="0.1" value="1.2" class="w-28 accent-indigo-500">
                </div>

                <!-- Camera FOV -->
                <div class="flex items-center justify-between gap-4">
                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-camera text-slate-400"></i> FOV
                    </span>
                    <input type="range" id="slider-fov" min="30" max="110" step="1" value="65" class="w-28 accent-indigo-500">
                </div>

                <!-- Options Bar -->
                <div class="flex justify-between items-center pt-1 text-xs text-slate-300">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk-autorotate" class="rounded accent-indigo-500">
                        <span>Auto Rotate</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk-wireframe" class="rounded accent-indigo-500">
                        <span>Wireframe</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk-fog" class="rounded accent-indigo-500" checked>
                        <span>Fog Effect</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 glass-panel border border-indigo-500/30 text-indigo-200 text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-30 flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i>
        <span id="toast-message">Message</span>
    </div>

    <script>
        let scene, camera, renderer, orbitControls;
        let currentFBX = null;
        
        // 🎬 アニメーション制御用の変数＆クロック追加！
        let mixer = null;
        const clock = new THREE.Clock();

        // Background texture state
        let loadedBgTexture = null;
        const DEFAULT_BG_COLOR = 0x0f172a;
        let activeFog = null; // フォグの保持用オブジェクト

        // Gyroscope tracking state
        let gyroMode = false;
        let gyroPermissionGranted = false;
        let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };

        // 移動制御用の状態管理変数
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };
        let moveSpeed = 0.1; // 移動速度（可変変数に変更）
        
        // Smooth camera rotation target
        const targetQuaternion = new THREE.Quaternion();

        // Scene lights reference
        let ambientLight, dirLight;

        // 方位定義（角度ごとのラベル）
        const PIXELS_PER_DEGREE = 3; // 1度あたりのピクセル幅

        function initScene() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(DEFAULT_BG_COLOR);
            
            // フォグのインスタンスを作成して保持
            activeFog = new THREE.FogExp2(DEFAULT_BG_COLOR, 0.015);
            scene.fog = activeFog;
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // OrbitControls
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.maxDistance = 100;
            orbitControls.minDistance = 0.5;

            // Lighting setup
            ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 12, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.4);
            fillLight.position.set(-5, -2, -5);
            scene.add(fillLight);

            // Grid helper
            const gridHelper = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            // Default fallback object
            createDefaultModel();

            // Setup movement controls
            setupMovementControls();

            // コンパスUIの初期生成
            initCompassUI();

            // Background controls setup
            setupBackgroundControls();

            // Resize handling
            window.addEventListener('resize', onWindowResize);
        }

        /* 🧭 コンパスUI要素の生成 */
        function initCompassUI() {
            const track = document.getElementById('compass-track');
            track.innerHTML = '';

            const cardinalDirections = {
                0: 'S', 45: 'SE', 90: 'E', 135: 'NE',
                180: 'N', 225: 'NW', 270: 'W', 315: 'SW', 360: 'S'
            };

            // スムーズな無限スクロールのために -180度から 540度まで生成
            for (let deg = -540; deg <= 540; deg += 15) {
                const normalizedDeg = (deg % 360 + 360) % 360;
                const mark = document.createElement('div');
                mark.className = 'compass-mark';

                const tick = document.createElement('div');
                const isMajor = normalizedDeg % 45 === 0;
                tick.className = `compass-tick ${isMajor ? 'major' : ''}`;
                mark.appendChild(tick);

                if (isMajor) {
                    const label = document.createElement('span');
                    const text = cardinalDirections[normalizedDeg];
                    label.className = `compass-label ${text === 'N' ? 'north' : ''}`;
                    label.innerText = text;
                    mark.appendChild(label);
                }

                track.appendChild(mark);
            }
        }

        /* 🧭 コンパスバーの位置更新 */
        function updateCompass() {
            const track = document.getElementById('compass-track');
            if (!track) return;

            // カメラが向いているYaw角（Y軸周りの回転角）を取得
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            
            // 方角（度数）を計算: 北(Z-)を0度として時計回り (0〜360度)
            let headingDeg = THREE.MathUtils.radToDeg(Math.atan2(-dir.x, -dir.z));
            if (headingDeg < 0) headingDeg += 360;

            // コンパスのトラックの位置を移動（-50% をベースに移動量を計算）
            const offsetPx = -headingDeg * PIXELS_PER_DEGREE;
            track.style.transform = `translateX(calc(-50% + ${offsetPx}px))`;
        }

        function createDefaultModel() {
            if (currentFBX) scene.remove(currentFBX);
            mixer = null; // リセット

            const group = new THREE.Group();

            // Create stylized knot
            const geometry = new THREE.TorusKnotGeometry(1, 0.35, 128, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0x6366f1,
                roughness: 0.3,
                metalness: 0.8,
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.position.y = 1.5;
            group.add(mesh);

            // Pedestal
            const baseGeo = new THREE.CylinderGeometry(1.8, 2, 0.4, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = 0.2;
            baseMesh.receiveShadow = true;
            group.add(baseMesh);

            currentFBX = group;
            scene.add(currentFBX);

            orbitControls.target.set(0, 1.2, 0);
            camera.position.set(0, 2.5, 5);
            orbitControls.update();
        }

        function setupBackgroundControls() {
            const bgFileInput = document.getElementById('input-bg-image');
            const bgColorPicker = document.getElementById('picker-bg-color');
            const bg360Toggle = document.getElementById('chk-360-bg');
            const resetBgBtn = document.getElementById('btn-reset-bg');

            // 1. 背景画像のロード・アップロード処理
            bgFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                document.getElementById('bg-filename').innerText = file.name;
                showToast('Loading background image...');

                const url = URL.createObjectURL(file);
                const loader = new THREE.TextureLoader();

                loader.load(url, (texture) => {
                    if (loadedBgTexture) loadedBgTexture.dispose();
                    loadedBgTexture = texture;
                    applyBackgroundTexture();
                    showToast('Background image applied');
                }, undefined, (err) => {
                    console.error('Error loading background image:', err);
                    showToast('Failed to load image');
                });
            });

            // 2. 360度/パノラマ マッピング切替
            bg360Toggle.addEventListener('change', () => {
                if (loadedBgTexture) {
                    applyBackgroundTexture();
                    showToast(bg360Toggle.checked ? '360° Skybox enabled' : 'Flat Image enabled');
                }
            });

            // 3. 単色カラーピッカー指定
            bgColorPicker.addEventListener('input', (e) => {
                const colorHex = e.target.value;
                scene.background = new THREE.Color(colorHex);
                scene.environment = null;
                if (activeFog) activeFog.color = new THREE.Color(colorHex);
            });

            // 4. 背景リセットボタン
            resetBgBtn.addEventListener('click', () => {
                if (loadedBgTexture) {
                    loadedBgTexture.dispose();
                    loadedBgTexture = null;
                }
                document.getElementById('bg-filename').innerText = 'Upload Image';
                bgColorPicker.value = '#0f172a';
                
                scene.background = new THREE.Color(DEFAULT_BG_COLOR);
                scene.environment = null;
                if (activeFog) activeFog.color = new THREE.Color(DEFAULT_BG_COLOR);
                
                showToast('Background reset to default');
            });
        }

        // 背景テクスチャの適用処理（Equirectangular vs 平面）
        function applyBackgroundTexture() {
            if (!loadedBgTexture) return;

            const is360 = document.getElementById('chk-360-bg').checked;

            if (is360) {
                // 360度パノラマ (Equirectangular) 設定
                loadedBgTexture.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = loadedBgTexture;
                scene.environment = loadedBgTexture;// モデル表面に環境反射を適用
                if (activeFog) activeFog.color = new THREE.Color(0x000000);
            } else {
                // 平面画像設定
                loadedBgTexture.mapping = THREE.UVMapping;
                scene.background = loadedBgTexture;
                scene.environment = null;
            }
        }

        // 移動イベント（キーボード＆スマホUI）の設定
        function setupMovementControls() {
            // WASD キーボード入力設定
            window.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveState.forward = true; break;
                    case 'KeyS': moveState.backward = true; break;
                    case 'KeyA': moveState.left = true; break;
                    case 'KeyD': moveState.right = true; break;
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveState.forward = false; break;
                    case 'KeyS': moveState.backward = false; break;
                    case 'KeyA': moveState.left = false; break;
                    case 'KeyD': moveState.right = false; break;
                }
            });

            // スマホ用「進む/戻る」ボタンのイベントバインド
            const btnForward = document.getElementById('btn-move-forward');
            const btnBackward = document.getElementById('btn-move-backward');

            const bindMoveButton = (btn, direction) => {
                const start = (e) => { e.preventDefault(); moveState[direction] = true; };
                const end = (e) => { e.preventDefault(); moveState[direction] = false; };

                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
            };

            bindMoveButton(btnForward, 'forward');
            bindMoveButton(btnBackward, 'backward');
        }

        // カメラ視点方向に基づいた移動計算処理
        function updateCameraMovement() {
            // カメラの視点（注視）方向を直接取得
            const frontVector = new THREE.Vector3();
            camera.getWorldDirection(frontVector); // カメラが向いている真前（上下角も含む）

            // 横移動用のベクトル（カメラの右方向）
            const sideVector = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

            const moveVector = new THREE.Vector3(0, 0, 0);

            if (moveState.forward) moveVector.add(frontVector);
            if (moveState.backward) moveVector.sub(frontVector);
            if (moveState.right) moveVector.add(sideVector);
            if (moveState.left) moveVector.sub(sideVector);

            if (moveVector.lengthSq() > 0) {
                moveVector.normalize().multiplyScalar(moveSpeed);
                camera.position.add(moveVector);
                
                // OrbitControls使用時は注視点（target）も移動させないと視点が引っ張られる
                if (orbitControls) {
                    orbitControls.target.add(moveVector);
                }
            }
        }

        document.getElementById('input-fbx').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fbx-filename').innerText = file.name;
            showToast('Loading FBX model...');

            const reader = new FileReader();
            reader.onload = function(event) {
                const contents = event.target.result;
                const loader = new THREE.FBXLoader();
                
                try {
                    const object = loader.parse(contents, '');
                    
                    if (currentFBX) scene.remove(currentFBX);
                    currentFBX = object;

                    // 🎬 アニメーションデータの解析＆自動再生処理を追加！
                    if (object.animations && object.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(object);
                        // 最初のアニメーション（または全アニメーション）をループ再生
                        object.animations.forEach((clip) => {
                            const action = mixer.clipAction(clip);
                            action.play();
                        });
                        showToast(`Playing ${object.animations.length} animation(s)`);
                    } else {
                        mixer = null;
                    }

                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    // Normalize position to origin
                    object.position.x += (object.position.x - center.x);
                    object.position.y += (object.position.y - center.y) + (size.y / 2);
                    object.position.z += (object.position.z - center.z);

                    // Enable shadows
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    scene.add(object);

                    // Adjust camera distance based on object size
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.2;
                    cameraZ = Math.max(cameraZ, 2);

                    camera.position.set(0, size.y / 2 + 1, cameraZ);
                    orbitControls.target.set(0, size.y / 2, 0);
                    orbitControls.update();

                    document.getElementById('status-text').innerText = `Loaded: ${file.name}`;
                    showToast('FBX Model loaded successfully!');
                } catch (error) {
                    console.error("Error parsing FBX:", error);
                    showToast('Failed to parse FBX file');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function setupGyroscope() {
            // Check if iOS DeviceOrientation permissions are required
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('gyro-permission-box').classList.remove('hidden');
            }

            window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        }

        document.getElementById('btn-request-gyro').addEventListener('click', function() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            gyroPermissionGranted = true;
                            document.getElementById('gyro-permission-box').classList.add('hidden');
                            setGyroMode(true);
                            showToast('Gyroscope enabled');
                        } else {
                            showToast('Gyroscope permission denied');
                        }
                    })
                    .catch(console.error);
            }
        });

        function handleDeviceOrientation(event) {
            if (!event.alpha && !event.beta && !event.gamma) return;

            deviceOrientation.alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0; // Z
            deviceOrientation.beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;   // X'
            deviceOrientation.gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0; // Y''

            if (gyroMode) {
                updateCameraFromGyro();
            }
        }

        function updateCameraFromGyro() {
            const alpha = deviceOrientation.alpha; 
            const beta = deviceOrientation.beta;   
            const gamma = deviceOrientation.gamma; 

            const euler = new THREE.Euler();
            // Standard Euler rotation order for device orientation
            euler.set(beta, alpha, -gamma, 'YXZ');
            
            targetQuaternion.setFromEuler(euler);

            // Adjust orientation for screen landscape/portrait mode
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;
            const qScreen = new THREE.Quaternion();
            qScreen.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);
            targetQuaternion.multiply(qScreen);

            // Camera orientation offset to look forward in 3D
            const qWorld = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
            targetQuaternion.multiply(qWorld);
        }

        function setGyroMode(enable) {
            gyroMode = enable;
            const touchBtn = document.getElementById('mode-touch-btn');
            const gyroBtn = document.getElementById('mode-gyro-btn');

            if (gyroMode) {
                gyroBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow";
                touchBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
                
                orbitControls.enabled = false;
                document.getElementById('status-text').innerText = "Mode: Smartphone Gyro Look";
                showToast("Gyro Mode Active");
            } else {
                touchBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow";
                gyroBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
                
                orbitControls.enabled = true;
                document.getElementById('status-text').innerText = "Mode: Touch / Orbit Controls";
                showToast("Orbit Mode Active");
            }
        }

        document.getElementById('mode-touch-btn').addEventListener('click', () => setGyroMode(false));
        document.getElementById('mode-gyro-btn').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function' && !gyroPermissionGranted) {
                document.getElementById('gyro-permission-box').classList.remove('hidden');
            }
            setGyroMode(true);
        });

        // 移動スピードスライダーの操作イベントを追加
        document.getElementById('slider-movespeed').addEventListener('input', (e) => {
            moveSpeed = parseFloat(e.target.value);
        });
        // Quick Settings Handlers
        document.getElementById('slider-light').addEventListener('input', (e) => {
            ambientLight.intensity = parseFloat(e.target.value) * 0.6;
            dirLight.intensity = parseFloat(e.target.value);
        });

        document.getElementById('slider-fov').addEventListener('input', (e) => {
            camera.fov = parseFloat(e.target.value);
            camera.updateProjectionMatrix();
        });

        document.getElementById('chk-autorotate').addEventListener('change', (e) => {
            orbitControls.autoRotate = e.target.checked;
            orbitControls.autoRotateSpeed = 2.0;
        });

        document.getElementById('chk-wireframe').addEventListener('change', (e) => {
            if (!currentFBX) return;
            currentFBX.traverse((child) => {
                if (child.isMesh && child.material) {
                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                    mats.forEach(m => m.wireframe = e.target.checked);
                }
            });
        });

        // Fog ON/OFF 切り替えイベント
        document.getElementById('chk-fog').addEventListener('change', (e) => {
            if (e.target.checked) {
                scene.fog = activeFog;
                showToast("Fog Enabled");
            } else {
                scene.fog = null;
                showToast("Fog Disabled");
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            camera.position.set(0, 2.5, 5);
            orbitControls.target.set(0, 1, 0);
            orbitControls.update();
            showToast("View Reset");
        });

        // Toggle UI panel visibility
        const panel = document.getElementById('settings-panel');
        document.getElementById('btn-settings-toggle').addEventListener('click', () => {
            panel.classList.toggle('translate-y-0');
            panel.classList.toggle('translate-y-[120%]');
            panel.classList.toggle('opacity-0');
        });

        // Fullscreen Toggle
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast(`Fullscreen error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 🎬 経過時間を計算してアニメーションを進める！
            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta);
            }

            updateCameraMovement();

            if (gyroMode) {
                // Smooth interpolation (slerp) to prevent gyro sensor jitter
                camera.quaternion.slerp(targetQuaternion, 0.1);
            } else {
                orbitControls.update();
            }

            // 🧭 毎フレームコンパスバーの位置をカメラの向きに合わせて更新！
            updateCompass();

            renderer.render(scene, camera);
        }

        // Initialize Application on Window Load
        window.onload = function() {
            initScene();
            setupGyroscope();
            animate();
        };
    </script>
</body>
</html>
