<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D FBX Viewer with FPS & Gyro Controls</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- fflate needed for FBXLoader -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <!-- FBXLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <!-- DeviceOrientationControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism panel style */
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .touch-button {
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-button:active {
            transform: scale(0.95);
        }

        /* Crosshair indicator */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
        }
        .crosshair::before {
            top: 4px; left: 0; width: 10px; height: 2px;
        }
        .crosshair::after {
            top: 0; left: 4px; width: 2px; height: 10px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden">

    <div id="canvas-container"></div>

    <!-- Center Crosshair -->
    <div id="crosshair" class="crosshair opacity-75"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 w-full h-full flex flex-col justify-between pointer-events-none p-4 md:p-6">
        
        <!-- Top Header Bar -->
        <div class="flex flex-wrap justify-between items-center gap-3 pointer-events-auto">
            <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-lg">
                <i class="fa-solid fa-cube text-indigo-400 text-xl"></i>
                <div>
                    <h1 class="text-sm font-bold text-gray-100">FBX 3D FPS Viewer</h1>
                    <p id="model-status" class="text-xs text-gray-400">モデル未読み込み</p>
                </div>
            </div>

            <!-- Action Buttons Panel -->
            <div class="flex items-center gap-2">
                <!-- Dropdown / Upload button -->
                <label class="glass-panel hover:bg-gray-800/80 transition text-xs font-medium px-3.5 py-2.5 rounded-xl cursor-pointer flex items-center gap-2 shadow-lg active:scale-95">
                    <i class="fa-solid fa-file-arrow-up text-indigo-400"></i>
                    <span>FBXを選択</span>
                    <input type="file" id="file-input" accept=".fbx" class="hidden" />
                </label>

                <!-- Gyro Enable Button (iOS/Android) -->
                <button id="btn-gyro" class="glass-panel hover:bg-gray-800/80 transition text-xs font-medium px-3.5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg active:scale-95">
                    <i class="fa-solid fa-compass text-amber-400"></i>
                    <span id="gyro-btn-text">ジャイロ有効化</span>
                </button>

                <!-- Reset View Button -->
                <button id="btn-reset" class="glass-panel hover:bg-gray-800/80 transition text-xs font-medium px-3.5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg active:scale-95">
                    <i class="fa-solid fa-rotate-left text-emerald-400"></i>
                    <span class="hidden sm:inline">リセット</span>
                </button>
            </div>
        </div>

        <div id="dropzone" class="absolute inset-x-4 top-20 bottom-24 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-96 glass-panel rounded-3xl border-2 border-dashed border-indigo-500/40 p-6 flex flex-col justify-center items-center text-center transition-all duration-300 pointer-events-auto shadow-2xl">
            <div class="w-16 h-16 bg-indigo-500/10 rounded-2xl flex items-center gap-2 justify-center mb-4 text-indigo-400 text-2xl">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h2 class="text-base font-bold mb-1">FBXファイルをドラッグ＆ドロップ</h2>
            <p class="text-xs text-gray-400 mb-4">またはボタンからファイルを選択してください（テクスチャ内蔵FBX対応）</p>
            <label class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl cursor-pointer shadow-md hover:shadow-indigo-500/25 transition">
                ファイルを選択
                <input type="file" id="dropzone-file-input" accept=".fbx" class="hidden" />
            </label>
        </div>

        <!-- Navigation Controls Container (Bottom) -->
        <div class="flex justify-between items-end w-full gap-4 pointer-events-none">
            
            <!-- Instructions Legend (Desktop/Tablet) -->
            <div class="glass-panel p-3 rounded-2xl hidden md:block text-xs text-gray-300 pointer-events-auto">
                <div class="font-bold text-indigo-300 mb-1">操作方法:</div>
                <ul class="space-y-0.5 text-[11px] text-gray-400">
                    <li><span class="text-gray-200">W / S:</span> 前進 / 後退</li>
                    <li><span class="text-gray-200">A / D:</span> 左右平行移動</li>
                    <li><span class="text-gray-200">マウスドラッグ:</span> 視点回転</li>
                    <li><span class="text-gray-200">スマホ:</span> ジャイロ + 画面ボタン前進/後退</li>
                </ul>
            </div>

            <!-- Mobile Movement Buttons (Always visible on bottom center/right) -->
            <div class="flex gap-3 mx-auto md:mx-0 pointer-events-auto">
                <button id="btn-move-forward" class="touch-button glass-panel bg-indigo-600/60 active:bg-indigo-600 border-indigo-400/40 w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex flex-col items-center justify-center gap-1 shadow-2xl border">
                    <i class="fa-solid fa-chevron-up text-xl text-white"></i>
                    <span class="text-xs font-bold text-white tracking-wider">進む</span>
                </button>
                <button id="btn-move-backward" class="touch-button glass-panel bg-gray-800/80 active:bg-gray-700 border-gray-600/40 w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex flex-col items-center justify-center gap-1 shadow-2xl border">
                    <i class="fa-solid fa-chevron-down text-xl text-gray-200"></i>
                    <span class="text-xs font-bold text-gray-200 tracking-wider">戻る</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Modal Indicator -->
    <div id="loading-overlay" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex flex-col items-center justify-center pointer-events-auto">
        <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <div id="loading-text" class="text-sm font-semibold text-white">FBXファイルを読み込み中...</div>
        <div id="loading-progress" class="text-xs text-indigo-300 mt-1">0%</div>
    </div>

    <script>
        // Global Three.js Scene Variables
        let scene, camera, renderer, clock;
        let deviceControls = null;
        let currentModel = null;

        // Camera movement state
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };
        const MOVE_SPEED = 12.0; // speed units per second

        // Mouse look state (FPS Drag Rotation)
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let isGyroActive = false;

        // Setup DOM element references
        const container = document.getElementById('canvas-container');
        const fileInput = document.getElementById('file-input');
        const dropzoneFileInput = document.getElementById('dropzone-file-input');
        const dropzone = document.getElementById('dropzone');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingProgress = document.getElementById('loading-progress');
        const modelStatus = document.getElementById('model-status');
        const btnGyro = document.getElementById('btn-gyro');
        const gyroBtnText = document.getElementById('gyro-btn-text');
        const btnReset = document.getElementById('btn-reset');

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827); // Dark gray background
            scene.fog = new THREE.FogExp2(0x111827, 0.008);

            // Camera initialization
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5); // Average eye level height (1.6m)

            // Clock for delta time calculations
            clock = new THREE.Clock();

            // Renderer configuration
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            const d = 25;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
            hemiLight.position.set(0, 50, 0);
            scene.add(hemiLight);

            // Grid Floor
            const gridHelper = new THREE.GridHelper(100, 100, 0x6366f1, 0x374151);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Window resize handler
            window.addEventListener('resize', onWindowResize, false);

            // Register Input & Touch Listeners
            setupControls();
        }

        function setupControls() {
            // Mouse Drag look controls
            const domEl = renderer.domElement;

            domEl.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            domEl.addEventListener('mousemove', (e) => {
                if (!isMouseDown || isGyroActive) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraEuler.setFromQuaternion(camera.quaternion);
                cameraEuler.y -= deltaX * 0.003; // Yaw
                cameraEuler.x -= deltaY * 0.003; // Pitch

                // Clamp pitch angle to prevent flipping
                cameraEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, cameraEuler.x));

                camera.quaternion.setFromEuler(cameraEuler);
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isMouseDown = false; });

            // Touch Drag look controls for mobile screen drag
            let touchStartPos = { x: 0, y: 0 };
            domEl.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, { passive: true });

            domEl.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && !isGyroActive) {
                    const deltaX = e.touches[0].clientX - touchStartPos.x;
                    const deltaY = e.touches[0].clientY - touchStartPos.y;

                    cameraEuler.setFromQuaternion(camera.quaternion);
                    cameraEuler.y -= deltaX * 0.004;
                    cameraEuler.x -= deltaY * 0.004;
                    cameraEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, cameraEuler.x));

                    camera.quaternion.setFromEuler(cameraEuler);
                    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, { passive: true });

            // Keyboard navigation (WASD)
            window.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = true; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = true; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = true; break;
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveState.forward = false; break;
                    case 'KeyS': case 'ArrowDown': moveState.backward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveState.left = false; break;
                    case 'KeyD': case 'ArrowRight': moveState.right = false; break;
                }
            });

            // On-screen Mobile Move Buttons
            setupTouchButton('btn-move-forward', 'forward');
            setupTouchButton('btn-move-backward', 'backward');

            // Drag and drop event handling
            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    if (file.name.toLowerCase().endsWith('.fbx')) {
                        loadFBXFile(file);
                    } else {
                        alert('FBX形式のファイルを選択してください。');
                    }
                }
            });

            // File inputs
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) loadFBXFile(e.target.files[0]);
            });
            dropzoneFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) loadFBXFile(e.target.files[0]);
            });

            // Reset camera button
            btnReset.addEventListener('click', resetCameraView);

            // Gyroscope permission and toggle handler
            btnGyro.addEventListener('click', toggleGyroscope);
        }

        // Helper to handle touch hold/release for forward and backward movement buttons
        function setupTouchButton(buttonId, stateKey) {
            const btn = document.getElementById(buttonId);
            const startMove = (e) => {
                e.preventDefault();
                moveState[stateKey] = true;
            };
            const stopMove = (e) => {
                e.preventDefault();
                moveState[stateKey] = false;
            };

            btn.addEventListener('mousedown', startMove);
            btn.addEventListener('mouseup', stopMove);
            btn.addEventListener('mouseleave', stopMove);
            btn.addEventListener('touchstart', startMove, { passive: false });
            btn.addEventListener('touchend', stopMove, { passive: false });
            btn.addEventListener('touchcancel', stopMove, { passive: false });
        }

        function toggleGyroscope() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ device permission request
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            activateDeviceControls();
                        } else {
                            alert('ジャイロセンサーへのアクセスが拒否されました。');
                        }
                    })
                    .catch(err => {
                        console.error('DeviceOrientation error:', err);
                        alert('ジャイロセンサーを有効化できませんでした。');
                    });
            } else {
                // Standard non-iOS or desktop fallback
                if (!isGyroActive) {
                    activateDeviceControls();
                } else {
                    deactivateDeviceControls();
                }
            }
        }

        function activateDeviceControls() {
            if (!deviceControls) {
                deviceControls = new THREE.DeviceOrientationControls(camera);
            }
            deviceControls.enabled = true;
            isGyroActive = true;
            gyroBtnText.textContent = "ジャイロON";
            btnGyro.classList.add('bg-amber-500/30', 'border-amber-400');
        }

        function deactivateDeviceControls() {
            if (deviceControls) {
                deviceControls.enabled = false;
            }
            isGyroActive = false;
            gyroBtnText.textContent = "ジャイロ有効化";
            btnGyro.classList.remove('bg-amber-500/30', 'border-amber-400');
        }

        function loadFBXFile(file) {
            showLoading(true, file.name);

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = function (e) {
                const contents = e.target.result;
                const loader = new THREE.FBXLoader();

                try {
                    const object = loader.parse(contents, '');
                    
                    // Remove existing model if any
                    if (currentModel) {
                        scene.remove(currentModel);
                    }

                    currentModel = object;

                    // Traverse model meshes to enable shadows & handle embedded textures/materials
                    currentModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;

                            // Fallback material handling if texture/material is missing
                            if (!child.material) {
                                child.material = new THREE.MeshStandardMaterial({
                                    color: 0xa0a0a0,
                                    roughness: 0.6,
                                    metalness: 0.2
                                });
                            } else if (Array.isArray(child.material)) {
                                child.material.forEach(mat => {
                                    mat.side = THREE.DoubleSide;
                                });
                            } else {
                                child.material.side = THREE.DoubleSide;
                            }
                        }
                    });

                    scene.add(currentModel);

                    // Auto-adjust camera position and scale
                    fitCameraToModel(currentModel);

                    // Update UI State
                    modelStatus.textContent = file.name;
                    dropzone.classList.add('hidden');
                    showLoading(false);

                } catch (error) {
                    console.error('FBX parse error:', error);
                    alert('FBXファイルの読み込みに失敗しました。ファイルが破損している可能性があります。');
                    showLoading(false);
                }
            };

            reader.onprogress = function (e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    loadingProgress.textContent = percent + '%';
                }
            };
        }

        // Adjust camera to fit target loaded FBX bounding box
        function fitCameraToModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Center model on floor level (Y=0)
            model.position.x -= center.x;
            model.position.y -= box.min.y;
            model.position.z -= center.z;

            const maxDim = Math.max(size.x, size.y, size.z);
            
            // Reposition camera slightly back and eye height
            const startDist = maxDim > 0 ? maxDim * 1.5 : 5;
            camera.position.set(0, Math.max(size.y * 0.5, 1.6), startDist);
            camera.lookAt(0, size.y * 0.5, 0);

            // Update camera Euler angle to match lookAt
            cameraEuler.setFromQuaternion(camera.quaternion);
        }

        function resetCameraView() {
            if (currentModel) {
                fitCameraToModel(currentModel);
            } else {
                camera.position.set(0, 1.6, 5);
                camera.rotation.set(0, 0, 0);
                cameraEuler.set(0, 0, 0, 'YXZ');
            }
        }

        function showLoading(show, fileName = '') {
            if (show) {
                loadingText.textContent = `${fileName} を読み込み中...`;
                loadingProgress.textContent = '0%';
                loadingOverlay.classList.remove('hidden');
            } else {
                loadingOverlay.classList.add('hidden');
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Update Gyroscope camera rotation if active
            if (isGyroActive && deviceControls) {
                deviceControls.update();
            }

            // Directional Vectors calculation for FPS Movement
            // Get camera looking direction vector
            const forwardVector = new THREE.Vector3();
            camera.getWorldDirection(forwardVector);

            // Calculate movement vector along horizontal ground plane (XZ plane)
            const forwardDirection = new THREE.Vector3(forwardVector.x, 0, forwardVector.z).normalize();
            
            // Right directional vector perpendicular to forward vector
            const rightDirection = new THREE.Vector3();
            rightDirection.crossVectors(forwardDirection, new THREE.Vector3(0, -1, 0)).negate().normalize();

            // Movement distance calculation based on speed & delta time
            const moveDistance = MOVE_SPEED * delta;

            // Apply forward / backward directional movement
            if (moveState.forward) {
                camera.position.addScaledVector(forwardDirection, moveDistance);
            }
            if (moveState.backward) {
                camera.position.addScaledVector(forwardDirection, -moveDistance);
            }
            if (moveState.left) {
                camera.position.addScaledVector(rightDirection, -moveDistance);
            }
            if (moveState.right) {
                camera.position.addScaledVector(rightDirection, moveDistance);
            }

            renderer.render(scene, camera);
        }

        // Initialize application after window load
        window.onload = function () {
            initScene();
            animate();
        };
    </script>
</body>
</html>
